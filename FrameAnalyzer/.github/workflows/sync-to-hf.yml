name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is empty or not set in GitHub repository secrets!"
            exit 1
          fi

          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Action"

          git push --force https://bit-4-bit:${HF_TOKEN}@huggingface.co/spaces/bit-4-bit/FrameAnalyzer HEAD:refs/heads/main

